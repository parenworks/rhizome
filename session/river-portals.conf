[preferred]
# Portal backends for river sessions. Without a desktop-specific
# file, river sessions fall back to ad-hoc backend resolution —
# pinning them explicitly keeps the file chooser, secrets and
# generic portals predictable.
#
# FileChooser is pinned to omanta (Omarchy's picker). On other
# systems substitute a backend you actually have installed, e.g.:
#   org.freedesktop.impl.portal.FileChooser=gtk
# The Secret backend needs gnome-keyring installed and unlocked.
org.freedesktop.impl.portal.FileChooser=omanta
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
